name: P1-08E supervised data operations and real recovery evidence
on:
  push:
    branches: ["codex/p1-08e-supervised-pilot"]
    paths: ["p1_08e_*.py", "test_p1_08e_*.py", "P1_08E_*", ".github/workflows/p1-08e-supervised-pilot.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p1-08e-${{ github.ref }}
  cancel-in-progress: false
jobs:
  engineering-and-independent-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MPLCONFIGDIR: /tmp/p1-08e-mpl
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install matplotlib==3.10.8 numpy==2.3.5 scipy==1.17.0 scikit-learn==1.8.0
      - name: Frozen operating plan and untouched inherited files
        run: |
          set -euo pipefail
          git show 3181b02:P1_08E_PLAN.json > /tmp/p1-08e-fixed-plan.json
          cmp /tmp/p1-08e-fixed-plan.json P1_08E_PLAN.json
          git diff --quiet --diff-filter=DMRTUXB c3b27a6aaf33b8291b9b3c7559521433c3f44b99 -- .
      - name: Complete tests, synthetic anomalies and local Git races
        run: |
          set -euo pipefail
          mkdir -p research/p1_08e_evidence
          python -m unittest -v 2>&1 | tee research/p1_08e_evidence/python-tests.log
      - name: Independent read-only GitHub archive and real SIGKILL evidence verification
        run: python p1_08e_verify.py --reference P1_08E_ARCHIVE_REFERENCE.json --out research/p1_08e_evidence/independent
      - name: Verify operational facts without claiming seven days
        run: |
          python - <<'PY'
          from pathlib import Path
          from p1_08d_receiver import read,c
          root=Path('research/p1_08e_evidence/independent')
          a=read(root/'acceptance.json')
          assert a['real_process_stop_returncode']==-9 and a['real_outage_ms']>0
          assert a['baseline_D_unchanged'] and a['baseline_D_raw_receipts']==48
          assert a['canonical_parent_chain_verified'] and a['remote_restore_and_partial_evidence_verified']
          assert a['retention_policy_months']>=24 and not a['elapsed_24month_retention_proven']
          assert a['seven_day_status']=='not_started' and not a['level2_pass'] and not a['real_seven_days_completed']
          assert not a['external_timestamp_attestation_verified'] and a['active_trading_hypotheses']==0
          for name,digest in read(root/'verification-files.json').items():assert c.sha_file(root/name)==digest,name
          PY
      - name: Package source, daily report, raw and portable backup with file hashes
        run: |
          python - <<'PY'
          import shutil
          from pathlib import Path
          root=Path('research/p1_08e_evidence')
          shutil.rmtree(root/'independent/supervisor/archive-cache.git')
          PY
          cp AGENTS.md P1_08E_* p1_08e_*.py test_p1_08e_*.py research/p1_08e_evidence/
          cp .github/workflows/p1-08e-supervised-pilot.yml research/p1_08e_evidence/workflow.yml
          python - <<'PY'
          import os,json,hashlib
          from pathlib import Path
          root=Path('research/p1_08e_evidence')
          m=dict(commit=os.environ['GITHUB_SHA'],run_id=os.environ['GITHUB_RUN_ID'],
              files_sha256={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.rglob('*')) if p.is_file()})
          (root/'artifact_manifest.json').write_text(json.dumps(m,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p1-08e-supervised-operations-${{ github.run_id }}
          path: research/p1_08e_evidence/
          retention-days: 45
          if-no-files-found: error
