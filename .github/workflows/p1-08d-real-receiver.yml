name: P1-08D real public data reception and independent retention
on:
  push:
    branches: ["codex/p1-08d-real-receiver"]
    paths: ["p1_08d_*.py", "test_p1_08d_*.py", "P1_08D_*", ".github/workflows/p1-08d-real-receiver.yml"]
  workflow_dispatch:
    inputs:
      parent_reference_json:
        description: 'Optional pinned prior capture reference JSON; no credentials. Empty uses committed P1_08D_PARENT.json.'
        required: false
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: p1-08d-${{ github.ref }}
  cancel-in-progress: false
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MPLCONFIGDIR: /tmp/p1-08d-mpl
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install matplotlib==3.10.8 numpy==2.3.5 scipy==1.17.0 scikit-learn==1.8.0
      - name: Frozen plan and unchanged inherited files
        run: |
          set -euo pipefail
          git show 19e832d:P1_08D_PLAN.json > /tmp/p1-08d-plan.json
          cmp /tmp/p1-08d-plan.json P1_08D_PLAN.json
          git diff --quiet --diff-filter=DMRTUXB 987af42806989b2ceb89f3b07dc0994785e35417 -- .
      - name: Complete tests; anomalies are synthetic and separate
        run: |
          set -euo pipefail
          mkdir -p research/tests
          python -m unittest -v 2>&1 | tee research/tests/python-tests.log
      - uses: actions/upload-artifact@v4
        with:
          name: p1-08d-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: research/tests/
          retention-days: 45
  capture:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact_id: ${{ steps.publish.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Start data-only receiver or restore pinned external parent
        env:
          GH_TOKEN: ${{ github.token }}
          PARENT_REFERENCE_JSON: ${{ inputs.parent_reference_json || '' }}
        run: |
          python - <<'PY'
          import os,subprocess,json
          from pathlib import Path
          from p1_08d_receiver import Receiver,read,write
          from p1_08d_retention import verify_retained_bundle
          root=Path('research/real_receiver');root.parent.mkdir(exist_ok=True)
          parent=Path('P1_08D_PARENT.json')
          supplied=os.environ.get('PARENT_REFERENCE_JSON','').strip()
          p=json.loads(supplied) if supplied else (read(parent) if parent.exists() else None)
          if p:
              write('research/used-parent-reference.json',p)
              base='repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/artifacts/'+str(int(p['capture_artifact_id']))
              for suffix,name in [('', 'parent-metadata.json'),('/zip','parent-capture.zip')]:
                  with Path('research',name).open('xb') as f:subprocess.run(['gh','api',base+suffix],stdout=f,check=True)
              meta=read('research/parent-metadata.json')
              assert meta['digest']==p['capture_artifact_digest']
              verification=verify_retained_bundle(Path('research/parent-capture.zip'),meta,Path('research/parent-independent-check'),
                  expected_commit=p['commit'],expected_run_id=int(p['run_id']))
              if 'receiver_checkpoint' in p:assert verification['receiver_checkpoint']==p['receiver_checkpoint']
              write('research/parent-checkpoint.json',verification['receiver_checkpoint'])
              payload=Path('research/parent-independent-check/downloaded_capture')
              manifest=read(payload/'bundle_manifest.json')
              Receiver.restore(payload/'receiver_snapshot.zip',root,expected_sha256=manifest['files_sha256']['receiver_snapshot.zip'],
                  anchor=verification['receiver_checkpoint'],expected_mode='real_public')
          else:Receiver.create(root,mode='real_public')
          PY
      - name: Actual public BTC and ETH receipt
        run: python p1_08d_receiver.py collect --root research/real_receiver --out research/first-collection.json
      - name: Restart as another process; preserve duplicate and gap classification
        run: python p1_08d_receiver.py collect --root research/real_receiver --out research/restarted-collection.json
      - name: Seal real capture bundle
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from p1_08d_receiver import Receiver,write,read
          from p1_08d_retention import publish_bundle
          r=Receiver('research/real_receiver');v=r.verify()
          parent=Path('research/parent-checkpoint.json')
          if parent.exists():assert r.verify(anchor=read(parent))['anchor_consistent']
          context={k:os.environ[v] for k,v in [('commit','GITHUB_SHA'),('run_id','GITHUB_RUN_ID'),('run_attempt','GITHUB_RUN_ATTEMPT')]}
          ref=Path('research/used-parent-reference.json')
          context['parent_reference']=read(ref) if ref.exists() else None
          publish_bundle(r,Path('research/capture-bundle'),context=context)
          rows=[x for x in r.processed_rows() if x['status']=='new']
          feeds={(x['symbol'],x['timeframe']) for x in rows}
          folder,manifest=r._batches()[-1]
          current=read(folder/'summary.json')
          current_feeds={(x.get('symbol'),x.get('timeframe')) for x in read(folder/'processed.json') if x['status'] in ('new','duplicate')}
          ok=(current['status']=='ok' and current['clock_context_verified'] and current['failed_requests']==0
              and all((s,'1h') in current_feeds for s in ('BTCUSDT','ETHUSDT')))
          write('research/real-reception-acceptance.json',dict(actual_BTC_ETH_closed1h_received=ok,
              raw_and_registry_hashes_verified=True,external_timestamp_attestation_verified=False,
              parent_checkpoint_preserved=parent.exists(),
              candidates=0,active_trading_hypotheses=0,long_term_operational_stability_proven=False))
          assert ok,'Real egress/closed1h acceptance incomplete; never substitute synthetic data'
          PY
      - uses: actions/upload-artifact@v4
        id: publish
        if: always()
        with:
          name: p1-08d-capture-${{ github.run_id }}-${{ github.run_attempt }}
          path: research/capture-bundle/
          retention-days: 45
          if-no-files-found: error
  independent-retention:
    needs: [tests, capture]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: p1-08d-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: research/acceptance/tests
      - name: Independently download platform artifact bytes and metadata
        env:
          CAPTURE_ARTIFACT_ID: ${{ needs.capture.outputs.artifact_id }}
        run: |
          python - <<'PY'
          import os,subprocess
          from pathlib import Path
          root=Path('research/acceptance');root.mkdir(parents=True,exist_ok=True)
          base='repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/artifacts/'+str(int(os.environ['CAPTURE_ARTIFACT_ID']))
          for suffix,name in [('', 'capture-github-metadata.json'),('/zip','capture-github-artifact.zip')]:
              with (root/name).open('xb') as f:subprocess.run(['gh','api',base+suffix],stdout=f,check=True)
          PY
      - name: Revalidate raw receipt, semantic normalization and registry checkpoint
        run: |
          python p1_08d_retention.py verify --artifact research/acceptance/capture-github-artifact.zip --metadata research/acceptance/capture-github-metadata.json --out research/acceptance/independent-verification --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID"
      - name: Publish complete acceptance with all file hashes
        run: |
          cp AGENTS.md P1_08D_* p1_08d_*.py test_p1_08d_*.py research/acceptance/
          cp .github/workflows/p1-08d-real-receiver.yml research/acceptance/workflow.yml
          python - <<'PY'
          import os,json,hashlib
          from pathlib import Path
          root=Path('research/acceptance')
          m=dict(commit=os.environ['GITHUB_SHA'],run_id=os.environ['GITHUB_RUN_ID'],run_attempt=os.environ['GITHUB_RUN_ATTEMPT'],
              files_sha256={str(p.relative_to(root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(root.rglob('*')) if p.is_file()})
          (root/'artifact_manifest.json').write_text(json.dumps(m,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p1-08d-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: research/acceptance/
          retention-days: 45
          if-no-files-found: error
