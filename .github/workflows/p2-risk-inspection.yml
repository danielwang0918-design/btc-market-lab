name: P2-02 risk inspection contract tests
on:
  push:
    branches: ["codex/p2-02-risk-inspection-v1"]
  pull_request:
    branches: ["p2-macro-event-risk"]
    paths:
      - "p2_risk_inspection.py"
      - "test_p2_risk_inspection.py"
      - "P2_02_RISK_INSPECTION.md"
      - ".github/workflows/p2-risk-inspection.yml"
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Run offline contract and existing P2 calendar tests
        run: |
          python -m unittest -v test_p2_risk_inspection.py
          python -m unittest -v test_event_risk.py
      - name: CLI help (no network)
        run: python p2_risk_inspection.py --help
