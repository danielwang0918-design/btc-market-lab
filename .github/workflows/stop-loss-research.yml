name: BTC stop-loss structure comparison

on:
  pull_request:
    branches: ["main"]
    paths:
      - "stop_loss_research.py"
      - "test_stop_loss_research.py"
      - "trade_diagnostics.py"
      - "entry_execution_audit.py"
      - "test_entry_execution_audit.py"
      - "entry_quality_research.py"
      - "test_entry_quality_research.py"
      - "test_trade_diagnostics.py"
      - "pattern_research.py"
      - "test_pattern_research.py"
      - "pattern_trade_study.py"
      - "test_pattern_trade_study.py"
      - "historical_backtest.py"
      - "market_structure.py"
      - "market_research.py"
      - "winrate_research.py"
      - "binance_market_data.py"
      - ".github/workflows/stop-loss-research.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: btc-stop-loss-research
  cancel-in-progress: true

jobs:
  comparison:
    name: Compare stops, diagnose trades, study OB entry quality
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Run unit tests
        run: python -m unittest -v
      - name: Download Binance Spot history
        run: python -u historical_backtest.py download-all BTCUSDT
      - name: Compare stop-loss variants
        run: >-
          python -u stop_loss_research.py BTCUSDT
          --fee-bps-per-side 10
          --slippage-bps-per-side 5
          --minimum-net-rr 1.5
          --max-setup-age-hours 168
          --atr-multiple 0.25
      - name: Diagnose every simulated trade
        run: python -u trade_diagnostics.py
      - name: Observe causal Elliott/harmonic candidates and MFE uncertainty
        run: python -u pattern_trade_study.py --data-dir data/historical --output-dir data/historical
      - name: Audit OB touch-hour execution timing
        run: python -u entry_execution_audit.py --data-dir data/historical --output-dir data/historical
      - name: Research OB entry confirmation and signal-time quality
        run: python -u entry_quality_research.py --data-dir data/historical --output-dir data/historical
      - name: Publish diagnostic summary
        if: always()
        run: |
          python - <<'PY2'
          import json, os
          from pathlib import Path
          root = Path("data/historical")
          path = root / "BTCUSDT_trade_diagnostics.json"
          pattern_path = root / "BTCUSDT_pattern_trade_study.json"
          execution_path = root / "BTCUSDT_entry_execution_audit.json"
          quality_path = root / "BTCUSDT_entry_quality_research.json"
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          lines = ["# BTCUSDT trade diagnostics and pattern-as-of research", ""]
          if path.exists():
              report = json.loads(path.read_text(encoding="utf-8"))
              lines += ["Original MFE/MAE includes entry/exit hourly candle extremes and may reflect unobservable intrabar order.", ""]
              lines += ["| Variant | Split | Trades | Mean MFE (R) | Mean MAE (R) | Rapid stops |", "|---|---|---:|---:|---:|---:|"]
              for name, variant in report["variants"].items():
                  for split in ("train", "validation", "test"):
                      x = variant["splits"][split]["all"]
                      lines.append(f'| {name} | {split} | {x["trades"]} | {x["mean_mfe_r"]} | {x["mean_mae_r"]} | {x["rapid_stops_le_2_bars"]}/{x["stop_count"]} |')
          else:
              lines += ["Original trade diagnosis was not produced; inspect earlier steps."]
          if pattern_path.exists():
              report = json.loads(pattern_path.read_text(encoding="utf-8"))
              lines += ["", "## Boundary-ambiguous MFE and pre-decision pattern observations", ""]
              lines += ["| Variant | Split | Losses | Full-candle MFE >=1R | Interior-only confirmed MFE >=1R | Ambiguous >=1R |", "|---|---|---:|---:|---:|---:|"]
              for name, splits in report["variants"].items():
                  for split in ("train", "validation", "test"):
                      x = splits[split]["mfe_boundary_audit"]
                      lines.append(f'| {name} | {split} | {x["losing_trades"]} | {x["reported_losers_ge_1r"]} | {x["interior_confirmed_losers_ge_1r"]} | {x["boundary_ambiguous_losers_ge_1r"]} |')
              lines += ["", "Pattern labels are observational only, with a fixed 168h recency window and signal-time causal confirmation. No entry or exit logic changed."]
          else:
              lines += ["", "Pattern observation report was not produced; inspect earlier steps."]
          if execution_path.exists():
              execution = json.loads(execution_path.read_text(encoding="utf-8"))
              base = execution["variants"].get("ob_1h_baseline", {}).get("test", {}).get("all", {})
              lines += ["", "## OB retest execution timing audit", "",
                        f"- Test original baseline: {base.get('trades')} trades; {base.get('one_bar_stops')} one-hour stops; {base.get('stop_within_two_held_bars')} within two holding bars.",
                        "- Entry timestamp is an hourly-open proxy for a wick touch, not observed intrabar fill time."]
          else:
              lines += ["", "Entry timing audit not produced; inspect earlier steps."]
          if quality_path.exists():
              quality = json.loads(quality_path.read_text(encoding="utf-8"))
              lines += ["", "## ENTRY-QUALITY-01 matched cohort (NOT full strategy backtest)", "",
                        "| Split | Original trades | Confirmed next-open trades | Stronger prior-high/low confirm trades |",
                        "|---|---:|---:|---:|"]
              for split, item in quality["splits"].items():
                  paired = item["paired_counterfactuals"]
                  lines.append(f"| {split} | {item['baseline']['trades']} | {paired['rejection_close']['counterfactual_matched']['trades']} | {paired['rejection_above_prior_extreme']['counterfactual_matched']['trades']} |")
              lines += ["", "All results are observational research. Do not claim a win-rate improvement or apply filters without a new independent test."]
          else:
              lines += ["", "ENTRY-QUALITY-01 report not produced; inspect earlier steps."]
          text = "\n".join(lines) + "\n"
          print(text)
          if summary:
              with open(summary, "a", encoding="utf-8") as file:
                  file.write(text)
          PY2
      - name: Upload data and diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BTCUSDT-trade-diagnostics
          path: |
            data/historical/BTCUSDT_1d.csv
            data/historical/BTCUSDT_4h.csv
            data/historical/BTCUSDT_1h.csv
            data/historical/BTCUSDT_stop_loss_research.json
            data/historical/BTCUSDT_trade_diagnostics.json
            data/historical/BTCUSDT_trade_diagnostics.csv
            data/historical/BTCUSDT_pattern_trade_study.json
            data/historical/BTCUSDT_pattern_trade_features.csv
            data/historical/BTCUSDT_1h_pattern_candidates.csv
            data/historical/BTCUSDT_4h_pattern_candidates.csv
            data/historical/BTCUSDT_1d_pattern_candidates.csv
            data/historical/BTCUSDT_entry_execution_audit.json
            data/historical/BTCUSDT_entry_execution_audit.csv
            data/historical/BTCUSDT_entry_quality_research.json
            data/historical/BTCUSDT_entry_quality_features.csv
          if-no-files-found: warn
          retention-days: 30