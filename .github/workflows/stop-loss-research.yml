name: BTC stop-loss structure comparison

on:
  pull_request:
    branches: ["main"]
    paths:
      - "stop_loss_research.py"
      - "test_stop_loss_research.py"
      - "trade_diagnostics.py"
      - "test_trade_diagnostics.py"
      - "historical_backtest.py"
      - "market_structure.py"
      - "market_research.py"
      - "winrate_research.py"
      - "binance_market_data.py"
      - ".github/workflows/stop-loss-research.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: btc-stop-loss-research
  cancel-in-progress: true

jobs:
  comparison:
    name: Compare stops and diagnose individual trades
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Run unit tests
        run: python -m unittest -v
      - name: Download Binance Spot history
        run: python -u historical_backtest.py download-all BTCUSDT
      - name: Compare stop-loss variants
        run: >-
          python -u stop_loss_research.py BTCUSDT
          --fee-bps-per-side 10
          --slippage-bps-per-side 5
          --minimum-net-rr 1.5
          --max-setup-age-hours 168
          --atr-multiple 0.25
      - name: Diagnose every simulated trade
        run: python -u trade_diagnostics.py
      - name: Publish diagnostic summary
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path=Path("data/historical/BTCUSDT_trade_diagnostics.json")
          summary=os.environ.get("GITHUB_STEP_SUMMARY")
          if not path.exists():
              message="The trade diagnostics report was not produced. Inspect earlier workflow steps."
              print(message)
              if summary:
                  with open(summary,"a",encoding="utf-8") as f: f.write("# BTC trade diagnostics\n\n"+message+"\n")
              raise SystemExit(0)
          report=json.loads(path.read_text(encoding="utf-8"))
          lines=["# BTCUSDT per-trade diagnostics","",
          "- MFE/MAE include hourly extremes through the exit candle; exit-candle intrabar order is unknowable from OHLC.",
          "- 4H alignment requires last closed 4H close vs EMA20 and 3-bar EMA20 slope to agree with direction.",
          "","| Variant | Split | Trades | Mean MFE (R) | Mean MAE (R) | Losing trades MFE >= 0.5R | Losing trades MFE >= 1R | 4H aligned | 4H opposed | Rapid stops |",
          "|---|---|---:|---:|---:|---:|---:|---:|---:|---:|"]
          for name,v in report["variants"].items():
              for split in ("train","validation","test"):
                  x=v["splits"][split]["all"]
                  lines.append(f'| {name} | {split} | {x["trades"]} | {x["mean_mfe_r"]} | {x["mean_mae_r"]} | {x["losers_reached_mfe_0_5r"]} | {x["losers_reached_mfe_1r"]} | {x["trend_aligned"]} | {x["trend_opposed"]} | {x["rapid_stops_le_2_bars"]}/{x["stop_count"]} |')
          text="\n".join(lines)+"\n"; print(text)
          if summary:
              with open(summary,"a",encoding="utf-8") as f: f.write(text)
          PY
      - name: Upload data and diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BTCUSDT-trade-diagnostics
          path: |
            data/historical/BTCUSDT_1d.csv
            data/historical/BTCUSDT_4h.csv
            data/historical/BTCUSDT_1h.csv
            data/historical/BTCUSDT_stop_loss_research.json
            data/historical/BTCUSDT_trade_diagnostics.json
            data/historical/BTCUSDT_trade_diagnostics.csv
          if-no-files-found: warn
          retention-days: 30
